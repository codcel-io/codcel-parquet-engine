[package]
name = "codcel-parquet-engine"
version = "0.1.9"
edition = "2021"
authors = ["Codcel <support@codcel.io>"]
description = "Parquet table implementation for Codcel, providing Excel-like lookup and filter operations on Parquet files."
documentation = "https://codcel.io"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codcel-io/codcel-parquet-engine"
homepage   = "https://codcel.io"
keywords = ["excel", "finance", "codcel", "spreadsheet", "functions"]
categories = ["mathematics", "finance"]

[dependencies]
codcel-calculation-engine = { git = "https://github.com/codcel-io/codcel-calculation-engine.git", branch = "pre-release-0.1.9" }
codcel-table-engine = { git = "https://github.com/codcel-io/codcel-table-engine.git", branch = "pre-release-0.1.9" }
async-trait = "0.1.91"
datafusion = "54.1.0"
tokio = { version = "1.53.1", features = ["sync", "time", "rt", "rt-multi-thread"] }
log = "0.4.33"
regex = "1.13.1"
once_cell = "1.21.4"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
